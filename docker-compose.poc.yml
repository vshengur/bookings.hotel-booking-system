# PoC all-in-one compose.
# Usage:
#   cp .env.poc .env
#   docker compose -f docker-compose.poc.yml up --build -d
#   Open http://localhost:5173 (frontend dev server) or npm run dev in frontend/booking-frontend/

services:

  # ── Infrastructure ─────────────────────────────────────────────────────────

  rabbitmq:
    image: rabbitmq:4.1-management
    container_name: rabbitmq
    hostname: rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    healthcheck:
      test: ["CMD", "rabbitmqctl", "status"]
      interval: 15s
      timeout: 5s
      retries: 5
    networks: [booking-net]

  mongodb:
    image: mongo:6
    container_name: mongodb
    ports: ["27017:27017"]
    networks: [booking-net]

  consul:
    image: hashicorp/consul:1.21
    container_name: consul
    ports: ["8500:8500"]
    command: agent -dev -client=0.0.0.0
    environment:
      CONSUL_BIND_INTERFACE: eth0
    networks: [booking-net]

  seq:
    image: datalust/seq:2024
    container_name: seq
    ports: ["5341:80"]
    environment:
      ACCEPT_EULA: "Y"
    networks: [booking-net]

  # ── Databases ───────────────────────────────────────────────────────────────

  auth-db:
    image: postgres:16-alpine
    container_name: auth-db
    environment:
      POSTGRES_DB: authdb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [booking-net]

  room-db:
    image: postgres:16-alpine
    container_name: room-db
    environment:
      POSTGRES_DB: room_service_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - ./services/room-service/migrations:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [booking-net]

  pricing-db:
    image: postgres:16-alpine
    container_name: pricing-db
    environment:
      POSTGRES_DB: pricing_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [booking-net]

  payment-db:
    image: postgres:16-alpine
    container_name: payment-db
    environment:
      POSTGRES_DB: payment
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [booking-net]

  bookings-db:
    image: postgres:16-alpine
    container_name: bookings-db
    environment:
      POSTGRES_DB: booking
      POSTGRES_USER: booking
      POSTGRES_PASSWORD: booking
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U booking"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [booking-net]

  # ── Application services ────────────────────────────────────────────────────

  auth-service:
    build: ./services/auth-service
    container_name: auth-service
    depends_on:
      auth-db:
        condition: service_healthy
    environment:
      DB_HOST: auth-db
      DB_PORT: "5432"
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_NAME: authdb
      JWT_SECRET: ${JWT_SECRET}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      GOOGLE_REDIRECT_URL: ${GOOGLE_REDIRECT_URL:-http://localhost:8080/api/auth/callback}
    networks: [booking-net]

  room-service:
    build: ./services/room-service
    container_name: room-service
    depends_on:
      room-db:
        condition: service_healthy
      consul:
        condition: service_started
    environment:
      SERVER_HOST: "0.0.0.0"
      SERVER_PORT: "8083"
      DB_HOST: room-db
      DB_PORT: "5432"
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_NAME: room_service_db
      DB_SSL_MODE: disable
      CONSUL_HOST: consul
      CONSUL_PORT: "8500"
      CONSUL_SERVICE_NAME: room-service
      CONSUL_SERVICE_ID: room-service-1
    networks: [booking-net]

  pricing-service:
    build: ./services/pricing-service
    container_name: pricing-service
    depends_on:
      pricing-db:
        condition: service_healthy
      consul:
        condition: service_started
    environment:
      ASPNETCORE_URLS: http://+:5003
      ConnectionStrings__DefaultConnection: >-
        Host=pricing-db;Port=5432;Database=pricing_db;Username=postgres;Password=postgres
      Consul__Address: http://consul:8500
      Consul__ServiceName: pricing-service
      Consul__ServiceId: pricing-service-1
      Consul__ServiceAddress: pricing-service
      Consul__ServicePort: "5003"
    networks: [booking-net]

  payment-service:
    build: ./services/payment-service/src/PaymentService.API
    container_name: payment-service
    depends_on:
      payment-db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    environment:
      ASPNETCORE_URLS: http://+:80
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__Db: Host=payment-db;Database=payment;Username=postgres;Password=postgres
      RabbitMq__Host: rabbitmq
      RabbitMq__Username: guest
      RabbitMq__Password: guest
      Seq__Url: http://seq:80
    networks: [booking-net]

  bookings-service:
    build: ./services/bookings-service
    container_name: bookingservice.api
    depends_on:
      bookings-db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      mongodb:
        condition: service_started
      room-service:
        condition: service_started
      payment-service:
        condition: service_started
    environment:
      ASPNETCORE_URLS: http://+:80
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__Postgres: >-
        Host=bookings-db;Database=booking;Username=booking;Password=booking
      ConnectionStrings__RabbitMq: rabbitmq://guest:guest@rabbitmq
      ConnectionStrings__Mongo: mongodb://mongodb
      PaymentService__Url: http://payment-service:80
      RoomService__Url: http://room-service:8083
      Serilog__WriteTo__1__Args__serverUrl: http://seq:80
    networks: [booking-net]

  # ── Gateway (nginx) ─────────────────────────────────────────────────────────

  gateway:
    image: nginx:1.27-alpine
    container_name: booking-api-gateway
    depends_on:
      - auth-service
      - room-service
      - pricing-service
      - payment-service
      - bookings-service
    ports:
      - "8080:8080"
    volumes:
      - ./services/dev-gateway/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./services/dev-gateway/nginx/conf.d:/etc/nginx/conf.d:ro
    networks: [booking-net]

networks:
  booking-net:
    name: booking-net
