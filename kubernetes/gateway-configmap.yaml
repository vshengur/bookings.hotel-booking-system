apiVersion: v1
kind: ConfigMap
metadata:
  name: gateway-config
  namespace: bookings
data:
  APP_ENVIRONMENT: "Production"
  ASPNETCORE_HTTP_PORTS: "80"
  ASPNETCORE_HTTPS_PORTS: "443"
  SEQ_URL: "http://seq.bookings:5341"
  CONSUL_ADDRESS: "http://consul.bookings:8500"
  appsettings.json: |
    {
      "Logging": {
        "LogLevel": {
          "Default": "Information",
          "Microsoft.AspNetCore": "Warning"
        }
      },
      "AllowedHosts": "*",
      "Serilog": {
        "MinimumLevel": {
          "Default": "Information", // Минимальный уровень логирования
          "Override": {
            "Microsoft": "Warning",
            "System": "Warning"
          }
        },
        "WriteTo": [
          {
            "Name": "Console"
          },
          {
            "Name": "File",
            "Args": {
              "path": "logs/log-.txt",
              "rollingInterval": "Day",
              "outputTemplate": "{Timestamp:yyyy-MM-dd HH:mm:ss.fff zzz} [{Level:u3}] {Message:lj}{NewLine}{Exception}"
            }
          },
          {
            "Name": "Seq",
            "Args": {
              "serverUrl": "${SEQ_URL}" // URL вашего Seq-сервера
              //"apiKey": "your_seq_api_key" // Если требуется API-ключ (опционально)
            }
          }
        ],
        "Enrich": [ "FromLogContext", "WithMachineName", "WithThreadId" ],
        "Properties": {
          "Application": "ApiGateway"
        }
      },
      "RouteConfig": {
        "/api/auth/login": false,
        "/api/auth/callback": false,
        "/api/auth/users": false
      }
    }

