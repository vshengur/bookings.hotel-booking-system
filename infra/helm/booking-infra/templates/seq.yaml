{{- if .Values.seq.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: seq
spec:
  replicas: 1
  selector:
    matchLabels:
      app: seq
  template:
    metadata:
      labels:
        app: seq
    spec:
      containers:
        - name: seq
          image: datalust/seq:2024
          env:
            - name: ACCEPT_EULA
              value: "Y"
          ports:
            - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: seq
spec:
  selector:
    app: seq
  ports:
    - port: 5341
      targetPort: 80
{{- end }}
