apiVersion: v1
kind: Secret
metadata:
  name: auth-service-secrets
  namespace: bookings
type: Opaque
data:
  google-client-id: <Base64-encoded Google OAuth Client ID — do not commit real values, inject via CI/CD or `kubectl create secret` from local env>
  google-client-secret: <Base64-encoded Google OAuth Client Secret — do not commit real values>
  google-redirect-url: <Base64-encoded OAuth redirect URL, e.g. "http://bookings.me:8081/api/auth/callback">
---
apiVersion: v1
kind: Secret
metadata:
  name: auth-db-credentials
  namespace: bookings
type: Opaque
data:
  username: <Base64-encoded DB username — do not commit real values>
  password: <Base64-encoded DB password — do not commit real values>
