worker_processes auto;

events { worker_connections 2048; }

http {
  # логгирование
  access_log /dev/stdout;
  error_log  /dev/stderr info;

  # кэш (диск) для ответов upstream'ов
  proxy_cache_path /var/cache/nginx levels=1:2 keys_zone=api_cache:50m
                   max_size=1g inactive=10m use_temp_path=off;

  # общий лимитер (10 rps на IP, до 20 бурст)
  limit_req_zone $binary_remote_addr zone=per_ip:10m rate=10r/s;

  # базовые настройки прокси
  proxy_http_version 1.1;
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_buffering on;
  proxy_buffers 32 8k;
  proxy_connect_timeout 3s;
  proxy_send_timeout 30s;
  proxy_read_timeout 30s;

  # включаем апстримы и сервер
  include /etc/nginx/conf.d/upstreams.conf;
  include /etc/nginx/conf.d/gateway.conf;
}
