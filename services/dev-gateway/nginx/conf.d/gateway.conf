server {
  listen 8080;
  server_name _;

  # Auth subrequest stub — PoC: allow all. Replace with real auth-service check in prod.
  location = /_auth {
    return 204;
  }

  # Health / tech pages
  location = /healthz { return 200 'OK'; add_header Content-Type text/plain; }
  location = /         { return 200 'NGINX dev gateway'; add_header Content-Type text/plain; }

  # Rate limiting (defined in nginx.conf)
  limit_req zone=per_ip burst=20 nodelay;
  limit_req_status 429;

  # Response caching for safe methods (skip when Authorization header present)
  proxy_cache             api_cache;
  proxy_cache_methods     GET HEAD;
  proxy_cache_bypass      $http_authorization $cookie_session;
  proxy_no_cache          $http_authorization $cookie_session;
  proxy_cache_valid       200 301 302 10m;
  proxy_cache_valid       404 1m;
  add_header X-Cache-Status $upstream_cache_status always;

  # Common proxy headers
  proxy_set_header Host              $host;
  proxy_set_header X-Real-IP         $remote_addr;
  proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;

  # ─── Auth Service ─────────────────────────────────────────────────────────
  # Auth-service routes sit at root level (/login, /callback, /users).
  # Gateway exposes them under /api/auth/ and strips that prefix.
  location ^~ /api/auth/ {
    rewrite ^/api/auth/(.*)$ /$1 break;
    proxy_pass http://auth_api;
  }

  # ─── Room Service ─────────────────────────────────────────────────────────
  location ^~ /api/rooms {
    auth_request /_auth;
    proxy_pass http://room_api;
  }

  # ─── Booking Service ──────────────────────────────────────────────────────
  location ^~ /api/booking {
    auth_request /_auth;
    proxy_pass http://booking_api;
  }

  # SignalR WebSocket for booking real-time updates
  location ^~ /hubs/booking {
    auth_request /_auth;
    proxy_pass         http://booking_api;
    proxy_http_version 1.1;
    proxy_set_header   Upgrade    $http_upgrade;
    proxy_set_header   Connection "upgrade";
    proxy_read_timeout 3600s;
  }

  # ─── Pricing Service ──────────────────────────────────────────────────────
  location ^~ /api/pricing {
    auth_request /_auth;
    proxy_pass http://pricing_api;
  }

  # ─── Payment Service ──────────────────────────────────────────────────────
  # Webhook must skip auth (called by the payment provider externally)
  location = /payment/webhook {
    proxy_pass http://payment_api;
  }

  location ^~ /payment {
    auth_request /_auth;
    proxy_pass http://payment_api;
  }
}
