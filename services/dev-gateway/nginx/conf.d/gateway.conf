map $http_origin $cors_origin {
  default                  "";
  "http://localhost:5173"  "$http_origin";
  "http://127.0.0.1:5173" "$http_origin";
}

# Macro-like snippet: add CORS response headers (referenced inside each location via include)
# nginx does not support real macros, so we inline the three headers + handle OPTIONS per location.

server {
  listen 8080;
  server_name _;

  # Common proxy headers (inherited by all proxy locations)
  proxy_http_version 1.1;
  proxy_set_header Host              $host;
  proxy_set_header X-Real-IP         $remote_addr;
  proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;

  # API responses are dynamic — caching disabled.
  # (Enable per-location for truly static resources if needed.)
  proxy_cache    off;
  proxy_no_cache 1;
  add_header X-Cache-Status $upstream_cache_status always;

  # Rate limiting (defined in nginx.conf)
  limit_req zone=per_ip burst=20 nodelay;
  limit_req_status 429;

  # Auth subrequest stub — PoC: allow all
  location = /_auth {
    return 204;
  }

  # Health
  location = /healthz {
    add_header Content-Type text/plain;
    return 200 'OK';
  }

  location = / {
    add_header Content-Type text/plain;
    return 200 'NGINX dev gateway';
  }

  # ─── Auth Service ─────────────────────────────────────────────────────────
  location ^~ /api/auth/ {
    if ($request_method = OPTIONS) {
      add_header Access-Control-Allow-Origin  $cors_origin always;
      add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS" always;
      add_header Access-Control-Allow-Headers "Content-Type, Authorization, X-Signature" always;
      add_header Access-Control-Max-Age 600 always;
      return 204;
    }
    add_header Access-Control-Allow-Origin  $cors_origin always;
    add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS" always;
    add_header Access-Control-Allow-Headers "Content-Type, Authorization, X-Signature" always;
    rewrite ^/api/auth/(.*)$ /$1 break;
    proxy_pass http://auth_api;
  }

  # ─── Room Service ─────────────────────────────────────────────────────────
  location ^~ /api/rooms {
    if ($request_method = OPTIONS) {
      add_header Access-Control-Allow-Origin  $cors_origin always;
      add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS" always;
      add_header Access-Control-Allow-Headers "Content-Type, Authorization, X-Signature" always;
      add_header Access-Control-Max-Age 600 always;
      return 204;
    }
    add_header Access-Control-Allow-Origin  $cors_origin always;
    add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS" always;
    add_header Access-Control-Allow-Headers "Content-Type, Authorization, X-Signature" always;
    auth_request /_auth;
    proxy_pass http://room_api;
  }

  # ─── Booking Service ──────────────────────────────────────────────────────
  location ^~ /api/booking {
    if ($request_method = OPTIONS) {
      add_header Access-Control-Allow-Origin  $cors_origin always;
      add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS" always;
      add_header Access-Control-Allow-Headers "Content-Type, Authorization, X-Signature" always;
      add_header Access-Control-Max-Age 600 always;
      return 204;
    }
    add_header Access-Control-Allow-Origin  $cors_origin always;
    add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS" always;
    add_header Access-Control-Allow-Headers "Content-Type, Authorization, X-Signature" always;
    auth_request /_auth;
    proxy_pass http://booking_api;
  }

  # SignalR WebSocket for booking real-time updates
  location ^~ /hubs/booking {
    if ($request_method = OPTIONS) {
      add_header Access-Control-Allow-Origin  $cors_origin always;
      add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS" always;
      add_header Access-Control-Allow-Headers "Content-Type, Authorization, X-Signature" always;
      add_header Access-Control-Max-Age 600 always;
      return 204;
    }
    add_header Access-Control-Allow-Origin  $cors_origin always;
    add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS" always;
    add_header Access-Control-Allow-Headers "Content-Type, Authorization, X-Signature" always;
    auth_request /_auth;
    proxy_pass         http://booking_api;
    proxy_http_version 1.1;
    proxy_set_header   Upgrade    $http_upgrade;
    proxy_set_header   Connection "upgrade";
    proxy_read_timeout 3600s;
  }

  # ─── Pricing Service ──────────────────────────────────────────────────────
  location ^~ /api/pricing {
    if ($request_method = OPTIONS) {
      add_header Access-Control-Allow-Origin  $cors_origin always;
      add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS" always;
      add_header Access-Control-Allow-Headers "Content-Type, Authorization, X-Signature" always;
      add_header Access-Control-Max-Age 600 always;
      return 204;
    }
    add_header Access-Control-Allow-Origin  $cors_origin always;
    add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS" always;
    add_header Access-Control-Allow-Headers "Content-Type, Authorization, X-Signature" always;
    auth_request /_auth;
    proxy_pass http://pricing_api;
  }

  # ─── Payment Service ──────────────────────────────────────────────────────
  # Webhook skips auth (called by the payment provider / smoke test externally)
  location = /payment/webhook {
    if ($request_method = OPTIONS) {
      add_header Access-Control-Allow-Origin  $cors_origin always;
      add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS" always;
      add_header Access-Control-Allow-Headers "Content-Type, Authorization, X-Signature" always;
      add_header Access-Control-Max-Age 600 always;
      return 204;
    }
    add_header Access-Control-Allow-Origin  $cors_origin always;
    add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS" always;
    add_header Access-Control-Allow-Headers "Content-Type, Authorization, X-Signature" always;
    proxy_pass http://payment_api;
  }

  location ^~ /payment {
    if ($request_method = OPTIONS) {
      add_header Access-Control-Allow-Origin  $cors_origin always;
      add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS" always;
      add_header Access-Control-Allow-Headers "Content-Type, Authorization, X-Signature" always;
      add_header Access-Control-Max-Age 600 always;
      return 204;
    }
    add_header Access-Control-Allow-Origin  $cors_origin always;
    add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS" always;
    add_header Access-Control-Allow-Headers "Content-Type, Authorization, X-Signature" always;
    auth_request /_auth;
    proxy_pass http://payment_api;
  }
}
