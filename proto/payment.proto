syntax = "proto3";
package payment.v1;
option csharp_namespace = "PaymentService.Contracts.Grpc.V1";
option go_package = "payment-service/api/gen/go/paymentv1;paymentv1";

message Money {
  string currency = 1;
  int64 amount_minor = 2;
}

message QuoteRequest {
  string room_id = 1;
  string start_date = 2; // YYYY-MM-DD
  string end_date = 3;   // YYYY-MM-DD
  int32 adults = 4;
  int32 children = 5;
}

message DailyPrice {
  string date = 1; // YYYY-MM-DD
  Money price = 2;
}

message QuoteResponse {
  Money total = 1;
  repeated DailyPrice daily = 2;
}

message CreateIntentRequest {
  string booking_id = 1;
  string room_id = 2;
  string customer_email = 3;
  Money amount = 4;
}

message CreateIntentResponse {
  string intent_id = 1;
  string psp_redirect_url = 2;
}

message RefundRequest {
  string booking_id = 1;
  int64 amount_minor = 2;
}

message RefundResponse {
  bool success = 1;
  string refund_id = 2;
}

service PaymentService {
  rpc Quote(QuoteRequest) returns (QuoteResponse);
  rpc CreateIntent(CreateIntentRequest) returns (CreateIntentResponse);
  rpc Refund(RefundRequest) returns (RefundResponse);
}
